name: 'Augment Action'
description: 'GitHub Action that reacts to comments with emoji'
author: 'Augment Code'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  github_token:
    description: 'GitHub token for API access'
    required: true
  comment_id:
    description: 'The ID of the comment to react to'
    required: true
  event_name:
    description: 'The GitHub event name (pull_request_review_comment or issue_comment)'
    required: true
  prompt:
    description: 'The prompt to send to Auggie agent'
    required: true
  augment_api_token:
    description: 'Augment API token for authentication'
    required: false
  augment_api_url:
    description: 'Augment API URL'
    required: false
    default: 'https://api.augmentcode.com'
  workspace_root:
    description: 'Workspace root path for Auggie to index (defaults to current directory)'
    required: false

outputs:
  success:
    description: 'Whether the reaction was successfully added'
    value: ${{ steps.react.outputs.success }}

runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install Auggie CLI
      run: bun install -g @augmentcode/auggie
      shell: bash

    - name: Install Action Dependencies
      run: bun install --production
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: React to comment
      id: react
      run: bun run ${{ github.action_path }}/src/index.ts
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_COMMENT_ID: ${{ inputs.comment_id }}
        INPUT_EVENT_NAME: ${{ inputs.event_name }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_AUGMENT_API_TOKEN: ${{ inputs.augment_api_token }}
        INPUT_AUGMENT_API_URL: ${{ inputs.augment_api_url }}
        INPUT_WORKSPACE_ROOT: ${{ inputs.workspace_root }}
        GITHUB_REPOSITORY: ${{ github.repository }}

